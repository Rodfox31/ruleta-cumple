<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14052e">
  <title>Control de la Ruleta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="control.css">
</head>
<body>
  <header class="cabecera">
    <h1 class="titulo" id="titulo">¡Ruleta del Cumple!</h1>
    <p class="estado" id="estado" data-estado="conectando">
      <span class="estado-punto"></span>
      <span id="estadoTexto">Conectando…</span>
    </p>
  </header>

  <!-- Control: el "modal" con el botón gigante -->
  <main class="modal" id="vistaControl" hidden>
    <p class="indicacion" id="indicacion">Apretá para girar la ruleta de la TV</p>
    <button class="boton-girar" id="botonGirar" type="button" disabled>
      <span class="boton-girar-texto" id="botonTexto">ESPERANDO…</span>
    </button>
    <p class="sala">Sala <strong id="codigoActual"></strong> · <button class="enlace" id="cambiarSala" type="button">cambiar</button></p>
  </main>

  <!-- Si se abre sin código (o se quiere cambiar) -->
  <main class="modal" id="vistaCodigo" hidden>
    <p class="indicacion">Escribí el código que aparece en la TV</p>
    <form class="form-codigo" id="formCodigo" autocomplete="off">
      <input class="input-codigo" id="inputCodigo" name="codigo" inputmode="text" autocapitalize="characters"
             maxlength="6" placeholder="ABC123" aria-label="Código de la sala" required>
      <button class="boton-conectar" type="submit">Conectar</button>
    </form>
  </main>

  <!-- Resultado (espejo de la tarjeta de la TV) -->
  <div class="resultado" id="resultado" hidden>
    <div class="tarjeta" id="tarjeta" role="dialog" aria-live="assertive" aria-labelledby="resNumero">
      <p class="tarjeta-etiqueta" id="resEtiqueta">¡Salió!</p>
      <p class="tarjeta-numero" id="resNumero">0</p>
      <p class="tarjeta-unidad" id="resUnidad">PUNTOS</p>
      <p class="tarjeta-descripcion" id="resDescripcion"></p>
      <button class="boton-continuar" id="botonContinuar" type="button">Continuar</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
  <script src="control.js"></script>
</body>
</html>
